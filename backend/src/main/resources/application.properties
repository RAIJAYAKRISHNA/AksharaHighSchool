spring.application.name=akshara-school
server.port=8080

# Load backend/.env if it exists (KEY=value lines)
spring.config.import=optional:file:.env[.properties]

# Frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Database (the password must come from backend/.env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/akshara_school}
spring.datasource.username=${DB_USERNAME:akshara_app}
spring.datasource.password=${DB_PASSWORD}

# Hibernate only checks the tables against the entities; database/schema.sql owns the schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Actuator: expose only the health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never