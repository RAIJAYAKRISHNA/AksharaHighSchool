spring.application.name=akshara-school
server.port=${PORT:8080}

# Load backend/.env if it exists
spring.config.import=optional:file:.env[.properties]

# =========================================================
# CORS
# =========================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========================================================
# SUPABASE POSTGRESQL DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://db.wgkrzgueirsxvvirehdx.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# =========================================================
# HIKARI CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# AUTHENTICATION / JWT
# =========================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:120}

# =========================================================
# ADMIN
# =========================================================
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# =========================================================
# ACTUATOR
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never